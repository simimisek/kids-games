  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a237e 0%, #0277bd 100%);
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: flex-start;
      padding: 16px 16px 40px;
      overflow-x: hidden;
    }

    /* ─── PLOVOUCÍ POZADÍ ─── */
    .bg-float {
      position: fixed; inset: 0;
      pointer-events: none; z-index: 0; overflow: hidden;
    }
    .bg-float span {
      position: absolute; font-size: 2.8rem;
      opacity: 0.12; animation: bgFloat 7s ease-in-out infinite; user-select: none;
    }
    .bg-float span:nth-child(1)  { top:  4%; left:  2%; animation-delay: 0s;    font-size: 3rem; }
    .bg-float span:nth-child(2)  { top:  8%; left: 74%; animation-delay: 1.1s;  font-size: 2.6rem; }
    .bg-float span:nth-child(3)  { top: 21%; left: 89%; animation-delay: 0.5s;  font-size: 2.3rem; }
    .bg-float span:nth-child(4)  { top: 39%; left:  1%; animation-delay: 2.2s;  font-size: 3.5rem; }
    .bg-float span:nth-child(5)  { top: 57%; left: 90%; animation-delay: 0.9s;  font-size: 2.5rem; }
    .bg-float span:nth-child(6)  { top: 74%; left:  8%; animation-delay: 1.8s;  font-size: 3.0rem; }
    .bg-float span:nth-child(7)  { top: 85%; left: 55%; animation-delay: 3.1s;  font-size: 2.8rem; }
    .bg-float span:nth-child(8)  { top: 92%; left: 20%; animation-delay: 0.3s;  font-size: 3.3rem; }
    .bg-float span:nth-child(9)  { top: 50%; left: 48%; animation-delay: 2.6s;  font-size: 2.0rem; opacity: 0.08; }
    .bg-float span:nth-child(10) { top: 15%; left: 40%; animation-delay: 1.0s;  font-size: 2.4rem; }
    .bg-float span:nth-child(11) { top: 67%; left: 68%; animation-delay: 3.6s;  font-size: 2.9rem; }
    .bg-float span:nth-child(12) { top: 33%; left: 23%; animation-delay: 1.9s;  font-size: 2.6rem; }
    @keyframes bgFloat {
      0%,100% { transform: translateY(0) rotate(-5deg); }
      50%      { transform: translateY(-16px) rotate(5deg); }
    }

    /* ─── SCREENS ─── */
    .screen { position: relative; z-index: 1; display: none; width: 100%; max-width: 480px; }
    .screen.active { display: flex; flex-direction: column; align-items: center; gap: 16px; padding-top: 16px; }

    /* ─── TITULNÍ ─── */
    .title {
      font-size: 2.2rem; color: #fff;
      text-align: center; text-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .subtitle {
      color: rgba(255,255,255,0.85);
      text-align: center; font-size: 1rem; line-height: 1.65;
    }

    /* ─── HUD ─── */
    .hud {
      width: 100%; display: flex; justify-content: space-between; align-items: center;
      background: rgba(255,255,255,0.2); border-radius: 14px;
      padding: 10px 20px; margin-top: 55px;
      color: #fff; font-size: 1.05rem; font-weight: 600;
    }
    .hud-timer { font-variant-numeric: tabular-nums; }

    /* ─── LEVEL PROGRESS ─── */
    .level-dots {
      display: flex; gap: 6px; justify-content: center;
      width: 100%;
    }
    .level-dot {
      width: 24px; height: 8px; border-radius: 99px;
      background: rgba(255,255,255,0.25);
      transition: background 0.4s;
    }
    .level-dot.done { background: #fff; }
    .level-dot.active { background: rgba(255,255,255,0.7); }

    /* ─── HERNÍ KARTA ─── */
    .game-card {
      background: #fff; border-radius: 20px;
      padding: 22px 16px 20px; width: 100%;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
      position: relative; overflow: hidden;
      display: flex; flex-direction: column; align-items: center; gap: 16px;
    }

    /* ─── HOUSENKA ─── */
    .caterpillar-wrap {
      width: 100%; display: flex;
      flex-wrap: wrap; justify-content: center;
      align-items: center; gap: 5px;
    }
    .seg-head {
      font-size: 2.4rem; line-height: 1; flex-shrink: 0;
    }
    .segment {
      width: 46px; height: 46px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.92rem; font-weight: 700;
      flex-shrink: 0;
      transition: background 0.3s, box-shadow 0.3s, transform 0.2s;
    }
    /* Předvyplněné — tmavě zelené */
    .segment.prefilled {
      background: linear-gradient(135deg, #1565c0, #1976d2);
      color: #fff;
      box-shadow: 0 3px 8px rgba(21,101,192,0.45);
    }
    /* Hráčem vyplněné — světle zelené */
    .segment.filled {
      background: linear-gradient(135deg, #2e7d32, #43a047);
      color: #fff;
      box-shadow: 0 3px 8px rgba(46,125,50,0.4);
    }
    /* Aktuální — hráč doplňuje */
    .segment.current {
      background: #fff;
      border: 3px solid #1565c0;
      color: #1565c0;
      animation: segPulse 1.3s ease-in-out infinite;
    }
    /* Budoucí — zatím prázdné */
    .segment.empty {
      background: rgba(0,0,0,0.06);
      border: 2px dashed rgba(0,0,0,0.18);
      color: transparent;
    }
    @keyframes segPulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(21,101,192,0.35); }
      50%      { box-shadow: 0 0 0 7px rgba(21,101,192,0); }
    }
    .segment.pop { animation: segPop 0.35s ease !important; }
    @keyframes segPop {
      0%   { transform: scale(1); }
      45%  { transform: scale(1.35); }
      100% { transform: scale(1); }
    }

    /* ─── OTÁZKA ─── */
    .question-label {
      font-size: 2rem; font-weight: 700; color: #1a237e;
      text-align: center; letter-spacing: 1px;
    }
    .question-label .q-mark { color: #0277bd; }

    /* ─── ODPOVĚDI ─── */
    .answers {
      width: 100%; display: flex; gap: 10px; justify-content: center;
    }
    .btn-answer {
      flex: 1; max-width: 130px;
      padding: 20px 6px;
      font-size: 1.55rem; font-weight: 700;
      border: none; border-radius: 16px;
      cursor: pointer; background: #f0f4ff; color: #1a237e;
      box-shadow: 0 4px 14px rgba(0,0,0,0.12);
      transition: transform 0.1s, background 0.12s;
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-answer:hover:not(:disabled) { transform: translateY(-4px); background: #dce8ff; }
    .btn-answer:active:not(:disabled) { transform: scale(0.94); }
    .btn-answer.correct {
      background: #22c55e; color: #fff;
      box-shadow: 0 4px 14px rgba(34,197,94,0.4);
    }
    .btn-answer.wrong {
      background: #ef4444; color: #fff;
      animation: btnShake 0.42s ease;
    }
    @keyframes btnShake {
      0%,100% { transform: translateX(0); }
      25%  { transform: translateX(-7px); }
      75%  { transform: translateX(7px); }
    }

    /* ─── LEVEL COMPLETE OVERLAY ─── */
    .lvl-overlay {
      position: absolute; inset: 0; border-radius: 20px;
      background: rgba(255,255,255,0.96);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 10px;
      z-index: 10;
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s;
    }
    .lvl-overlay.visible { opacity: 1; pointer-events: all; }
    .lvl-overlay .big-emoji { font-size: 4rem; animation: popIn 0.5s ease; }
    .lvl-overlay .lvl-text { font-size: 1.4rem; font-weight: 700; color: #1a237e; }
    .lvl-overlay .next-text { font-size: 1rem; color: #666; }
    @keyframes popIn {
      0%  { transform: scale(0.3); opacity: 0; }
      60% { transform: scale(1.2); }
      100%{ transform: scale(1); opacity: 1; }
    }

    /* ─── KONEC HRY ─── */
    .result-card {
      background: #fff; border-radius: 20px;
      padding: 32px 24px; width: 100%;
      text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }
    .result-card h2 { font-size: 1.8rem; color: #333; margin-bottom: 8px; }
    .result-level {
      font-size: 2.8rem; font-weight: 700; color: #1a237e; margin: 10px 0 4px;
    }
    .result-time-sub { font-size: 1.1rem; color: #888; }
    .result-card p { color: #666; font-size: 0.95rem; margin-top: 8px; }

    /* ─── ULOŽENÍ ─── */
    .save-row { width: 100%; display: flex; gap: 10px; }
    .save-row input {
      flex: 1; padding: 14px 18px; border-radius: 12px; border: none;
      font-size: 1rem; outline: 2px solid transparent;
      box-shadow: 0 4px 16px rgba(0,0,0,0.12); transition: outline 0.2s;
    }
    .save-row input:focus { outline: 2px solid #1565c0; }

    /* ─── ŽEBŘÍČEK ─── */
    .leaderboard-card {
      background: #fff; border-radius: 20px; padding: 22px;
      width: 100%; box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    .leaderboard-card h3 { text-align: center; color: #333; font-size: 1.1rem; margin-bottom: 14px; }
    .leaderboard-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .leaderboard-list li {
      display: grid; grid-template-columns: 28px 1fr auto;
      gap: 8px; align-items: center; font-size: 0.95rem; color: #444;
      padding: 6px 0; border-bottom: 1px solid #f0f0f0;
    }
    .leaderboard-list li:last-child { border-bottom: none; }
    .lb-rank { font-weight: 700; color: #1565c0; text-align: center; }
    .lb-name { font-weight: 600; }
    .lb-score { font-variant-numeric: tabular-nums; color: #1565c0; font-weight: 700; white-space: nowrap; }
    .lb-date { font-size: 0.78rem; color: #aaa; grid-column: 2/4; margin-top: -4px; }
    .lb-empty { text-align: center; color: #aaa; font-style: italic; font-size: 0.9rem; padding: 8px 0; }

    /* ─── TLAČÍTKA ─── */
    .btn {
      width: 100%; padding: 15px; font-size: 1.05rem; font-weight: 700;
      border: none; border-radius: 14px; cursor: pointer;
      transition: transform 0.1s; font-family: inherit;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary {
      background: #1565c0; color: #fff;
      box-shadow: 0 4px 16px rgba(21,101,192,0.35);
    }
    .btn-primary:hover { background: #1a237e; }
    .btn-secondary {
      background: rgba(21,101,192,0.1); color: #1565c0;
      border: 2px solid rgba(21,101,192,0.25); box-shadow: none;
    }
    .btn-secondary:hover { background: rgba(21,101,192,0.18); }

    /* ─── DOMŮ ─── */
    .btn-home-fixed {
      position: fixed; top: 12px; right: 12px; z-index: 200;
      background: rgba(0,0,0,0.25); border: none; border-radius: 10px;
      padding: 7px 14px; color: #fff; font-family: inherit;
      font-size: 0.85rem; font-weight: 700; text-decoration: none; cursor: pointer;
    }
    .btn-home-fixed:hover { background: rgba(0,0,0,0.4); }

    /* ─── RESPONZIVITA ─── */
    @media (max-width: 400px) {
      body { padding: 10px 10px 32px; }
      .title { font-size: 1.85rem; }
      .segment { width: 40px; height: 40px; font-size: 0.8rem; }
      .seg-head { font-size: 2rem; }
      .question-label { font-size: 1.7rem; }
      .btn-answer { font-size: 1.35rem; padding: 16px 4px; }
      .btn { padding: 13px; font-size: 0.98rem; }
    }
  </style>
</head>
<body>

<!-- ═══════════════ PLOVOUCÍ POZADÍ ═══════════════ -->
<div class="bg-float" aria-hidden="true">
  <span>🐛</span><span>×</span><span>🐛</span><span>×</span>
  <span>🐛</span><span>×</span><span>🐛</span><span>×</span>
  <span>🐛</span><span>×</span><span>🐛</span><span>×</span>
</div>

<!-- ═══════════════ START SCREEN ═══════════════ -->
<div id="screen-start" class="screen active">

  </p>
  <button class="btn btn-primary" onclick="startGame()">▶ Hrát</button>

<!-- ═══════════════ GAME SCREEN ═══════════════ -->
<div id="screen-game" class="screen">
  <a href="index.html" class="btn-home-fixed">🏠 Domů</a>

  <div class="hud">
    <span id="hud-level">Úroveň 1 — násobilka ×2</span>
    <span class="hud-timer" id="hud-timer">0:00</span>
  </div>

  <!-- Tečky úrovní (9 levelů) -->
  <div class="level-dots" id="level-dots"></div>

  <div class="game-card">
    <!-- Housenka -->
    <div class="caterpillar-wrap" id="caterpillar"></div>


    <!-- Odpovědní tlačítka -->
    <div class="answers" id="answers"></div>

    <!-- Overlay při dokončení levelu -->
    <div class="lvl-overlay" id="lvl-overlay">
      <div class="big-emoji" id="lvl-emoji">🎉</div>
      <div class="lvl-text" id="lvl-text">Skvělé!</div>
      <div class="next-text" id="lvl-next"></div>

<!-- ═══════════════ END SCREEN ═══════════════ -->
<div id="screen-end" class="screen">
  <div class="result-card">
    <h2 id="end-title">Výborně! 🎉</h2>
    <div class="result-level" id="final-level"></div>
    <div class="result-time-sub" id="final-time-sub"></div>
    <p id="end-desc"></p>
  </div>
  <div class="save-row" id="save-row">
    <input type="text" id="player-name" placeholder="Tvoje jméno…" maxlength="20"
           onkeydown="if(event.key==='Enter') saveScore()" />
    <button class="btn btn-primary" style="width:auto;padding:14px 20px;font-size:1rem;"
            onclick="saveScore()">Uložit</button>
  </div>
  <button class="btn btn-primary" onclick="startGame()">🔄 Hrát znovu</button>
  <a href="index.html" style="width:100%;text-decoration:none;">
    <button class="btn btn-primary">🏠 Zpět na výběr</button>
  </a>
  <div class="leaderboard-card">
    <h3>🏆 Nejlepší hráči</h3>
    <ul class="leaderboard-list" id="lb-end"></ul>
  </div>
</div>

<script>
  // ─── CONFIG ───────────────────────────────────────────────────────────────
  const QUIZ_TYPE  = 'math-caterpillar';
  const DB_URL     = 'https://kids-games-3a167-default-rtdb.europe-west1.firebasedatabase.app';
  const MULTIPLIERS = [2, 3, 4, 5, 6, 7, 8, 9, 10];  // 9 úrovní
  const PREFILLED   = 1;   // první číslo předvyplněné (n×1), zbytek hráč doplňuje
  const MAX_STEP    = 10;  // tabulka jde do ×10

  // ─── STATE ────────────────────────────────────────────────────────────────
  let levelIdx   = 0;          // aktuální úroveň (index do MULTIPLIERS)
  let stepIdx    = PREFILLED;  // aktuální krok, který hráč doplňuje (0-index)
  let answering  = false;      // blokuje klikání při animaci
  let timerStart = null, timerInterval = null;
  let finalMs    = 0, levelReached = 0;

  // ─── HELPERS ──────────────────────────────────────────────────────────────
  function mul()          { return MULTIPLIERS[levelIdx]; }
  function val(step)      { return (step + 1) * mul(); }   // krok 0 → n×1
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }
  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // ─── TIMER ────────────────────────────────────────────────────────────────
  function startTimer() {
    timerStart = Date.now();
    timerInterval = setInterval(() => {
      document.getElementById('hud-timer').textContent = fmtTime(Date.now() - timerStart);
    }, 100);
  }
  function stopTimer() {
    clearInterval(timerInterval);
    finalMs = Date.now() - timerStart;
  }
  function fmtTime(ms) {
    const s = Math.floor(ms / 1000);
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }

  // ─── LEVEL DOTS ───────────────────────────────────────────────────────────
  function renderLevelDots() {
    const el = document.getElementById('level-dots');
    el.innerHTML = '';
    MULTIPLIERS.forEach((_, i) => {
      const dot = document.createElement('div');
      dot.className = 'level-dot' +
        (i < levelIdx ? ' done' : i === levelIdx ? ' active' : '');
      el.appendChild(dot);
    });
  }

  // ─── HOUSENKA ─────────────────────────────────────────────────────────────
  function renderCaterpillar() {
    const wrap = document.getElementById('caterpillar');
    wrap.innerHTML = '<span class="seg-head" title="Housenka">🐛</span>';

    for (let i = 0; i < MAX_STEP; i++) {
      const seg = document.createElement('div');
      seg.id = 'seg-' + i;

      if (i < PREFILLED) {
        seg.className = 'segment prefilled';
        seg.textContent = val(i);
      } else if (i === stepIdx) {
        seg.className = 'segment current';
        seg.textContent = '?';
      } else if (i < stepIdx) {
        seg.className = 'segment filled';
        seg.textContent = val(i);
      } else {
        seg.className = 'segment empty';
        seg.textContent = '';
      }
      wrap.appendChild(seg);
    }
  }



  // ─── ODPOVĚDI ─────────────────────────────────────────────────────────────
  function renderAnswers() {
    const correct = val(stepIdx);
    const m = mul();

    // Dva rušivé prvky: ±multiplier od správné odpovědi
    let w1 = correct + m;
    let w2 = correct - m;
    if (w2 <= 0) w2 = correct + 2 * m;   // záporné? posun výš
    if (w1 === correct) w1 = correct + m * 2;

    const options = shuffle([correct, w1, w2]);

    const el = document.getElementById('answers');
    el.innerHTML = '';
    options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'btn-answer';
      btn.textContent = opt;
      btn.onclick = () => handleAnswer(btn, opt, correct);
      el.appendChild(btn);
    });
  }

  // ─── ZPRACOVÁNÍ ODPOVĚDI ──────────────────────────────────────────────────
  function handleAnswer(btn, chosen, correct) {
    if (answering) return;

    if (chosen === correct) {
      answering = true;
      btn.classList.add('correct');
      btn.disabled = true;

      // Vyplň článek housenky
      const seg = document.getElementById('seg-' + stepIdx);
      seg.className = 'segment filled pop';
      seg.textContent = chosen;
      setTimeout(() => seg.classList.remove('pop'), 380);

      stepIdx++;

      setTimeout(() => {
        if (stepIdx >= MAX_STEP) {
          // ─── LEVEL HOTOVÝ ───
          levelReached = levelIdx + 1;
          levelIdx++;

          if (levelIdx >= MULTIPLIERS.length) {
            // ─── HRA DOKONČENA ───
            stopTimer();
            showEndScreen(true);
          } else {
            showLevelComplete();
          }
        } else {
          // Jen posun na další článek
          const nextSeg = document.getElementById('seg-' + stepIdx);
          if (nextSeg) {
            nextSeg.className = 'segment current';
            nextSeg.textContent = '?';
          }
          renderAnswers();
          answering = false;
        }
      }, 420);

    } else {
      // ─── ŠPATNÁ ODPOVĚĎ ─── záblesk, nic se nemění
      btn.classList.add('wrong');
      setTimeout(() => btn.classList.remove('wrong'), 500);
    }
  }

  // ─── LEVEL COMPLETE OVERLAY ───────────────────────────────────────────────
  function showLevelComplete() {
    const overlay = document.getElementById('lvl-overlay');
    const nextMul = MULTIPLIERS[levelIdx];

    document.getElementById('lvl-emoji').textContent = ['🎉','⭐','🏅','🌟','🦋','🚀','🏆','💎','👑'][levelIdx - 1] || '🎉';
    document.getElementById('lvl-text').textContent =
      `Skvělé! Násobilka ×${MULTIPLIERS[levelIdx - 1]} splněna!`;
    document.getElementById('lvl-next').textContent =
      `Připrav se na ×${nextMul}…`;

    overlay.classList.add('visible');

    setTimeout(() => {
      overlay.classList.remove('visible');
      stepIdx = PREFILLED;
      answering = false;
      renderLevelDots();
      renderCaterpillar();
      renderAnswers();
      updateHUD();
    }, 2000);
  }

  // ─── HUD ──────────────────────────────────────────────────────────────────
  function updateHUD() {
    document.getElementById('hud-level').textContent =
      `Úroveň ${levelIdx + 1} — násobilka ×${mul()}`;
  }

  // ─── START GAME ───────────────────────────────────────────────────────────
  function startGame() {
    levelIdx     = 0;
    stepIdx      = PREFILLED;
    levelReached = 0;
    finalMs      = 0;
    answering    = false;
    clearInterval(timerInterval);

    document.getElementById('save-row').style.display = '';
    document.getElementById('hud-timer').textContent = '0:00';
    document.getElementById('lvl-overlay').classList.remove('visible');

    showScreen('screen-game');
    renderLevelDots();
    renderCaterpillar();
    renderAnswers();
    updateHUD();
    startTimer();
  }

  // ─── END SCREEN ───────────────────────────────────────────────────────────
  function showEndScreen(allDone) {
    const total = MULTIPLIERS.length;
    const reached = levelReached;

    if (allDone) {
      document.getElementById('end-title').textContent = '🏆 Neuvěřitelné!';
      document.getElementById('final-level').textContent = `Všech ${total} úrovní!`;
      document.getElementById('final-time-sub').textContent = `Čas: ${fmtTime(finalMs)}`;
      document.getElementById('end-desc').textContent =
        `Zvládl jsi celou násobilku od ×2 až po ×10. To je výkon!`;
    } else {
      document.getElementById('end-title').textContent = 'Skvělá práce! 🎉';
      document.getElementById('final-level').textContent = `Úroveň ${reached} z ${total}`;
      document.getElementById('final-time-sub').textContent = `Čas: ${fmtTime(finalMs)}`;
      document.getElementById('end-desc').textContent =
        `Dosáhl jsi násobilky ×${MULTIPLIERS[reached - 1]}. Příště to zkus dál!`;
    }

    document.getElementById('player-name').value = '';
    showScreen('screen-end');
    renderLeaderboard('lb-end');
  }

  // ─── FIREBASE ─────────────────────────────────────────────────────────────
  async function getScores() {
    try {
      const r = await fetch(DB_URL + '/scores/' + QUIZ_TYPE + '.json');
      const d = await r.json();
      const scores = Array.isArray(d) ? d : [];
      const ym = new Date().getFullYear() + '-' + String(new Date().getMonth() + 1).padStart(2, '0');
      if (scores.some(s => !s.month || s.month !== ym)) return [];
      return scores;
    } catch { return []; }
  }

  async function saveScore() {
    const nameInput = document.getElementById('player-name');
    const name = nameInput.value.trim();
    if (!name) { nameInput.style.outline = '3px solid #ef4444'; nameInput.focus(); return; }
    nameInput.style.outline = '';

    const scores = await getScores();
    const ym = new Date().getFullYear() + '-' + String(new Date().getMonth() + 1).padStart(2, '0');
    // Uložit: level jako primární metrika, ms jako tiebreaker
    scores.push({ name, level: levelReached, ms: finalMs, month: ym, date: new Date().toLocaleDateString('cs-CZ') });
    // Seřadit: vyšší level je lepší; stejný level → kratší čas
    scores.sort((a, b) => b.level - a.level || a.ms - b.ms);
    const top10 = scores.slice(0, 10);

    try {
      await fetch(DB_URL + '/scores/' + QUIZ_TYPE + '.json', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(top10)
      });
    } catch {}

    renderLeaderboard('lb-end');
    document.getElementById('save-row').style.display = 'none';
    nameInput.value = '';
  }

  async function renderLeaderboard(elId) {
    const el = document.getElementById(elId);
    el.innerHTML = '<li class="lb-empty">Načítám…</li>';
    const scores = await getScores();
    if (!scores.length) { el.innerHTML = '<li class="lb-empty">Zatím žádné výsledky.</li>'; return; }
    el.innerHTML = scores.map((s, i) => `
      <li>
        <span class="lb-rank">${i + 1}.</span>
        <span class="lb-name">${esc(s.name)}</span>
        <span class="lb-score">Úr. ${s.level} · ${fmtTime(s.ms)}</span>
        <span class="lb-date">${esc(s.date || '')}</span>
      </li>`).join('');
  }

  function esc(str) {
    return String(str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ─── INIT ─────────────────────────────────────────────────────────────────
  renderLeaderboard('lb-start');
</script>
</body>
</html>
