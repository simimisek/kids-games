    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #4a148c 0%, #880e4f 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 16px 16px 40px;
      overflow-x: hidden;
    }

    .star-bg { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .star-bg span {
      position: absolute; font-size: 2rem; opacity: 0.12;
      animation: starF 9s ease-in-out infinite; user-select: none;
    }
    @keyframes starF {
      0%,100% { transform: translateY(0) rotate(-5deg); }
      50%      { transform: translateY(-16px) rotate(5deg); }
    }

    .screen { position: relative; z-index: 1; display: none; width: 100%; max-width: 480px; }
    .screen.active { display: flex; flex-direction: column; align-items: center; gap: 16px; padding-top: 16px; }

    .title    { font-size: 2.2rem; color: #fff; text-align: center; text-shadow: 0 2px 8px rgba(0,0,0,0.3); }
    .subtitle { color: rgba(255,255,255,0.85); text-align: center; font-size: 1rem; line-height: 1.65; }

    .hud {
      width: 100%; display: flex; justify-content: space-between; align-items: center;
      background: rgba(255,255,255,0.2); border-radius: 14px;
      padding: 10px 20px; margin-top: 55px;
      color: #fff; font-size: 1.1rem; font-weight: 600;
    }
    .hud-timer { font-variant-numeric: tabular-nums; }

    /* ─── PEXESO GRID ─── */
    .pexeso-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    /* ─── CARD FLIP ─── */
    .card {
      aspect-ratio: 1;
      cursor: pointer;
      perspective: 900px;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .card-inner {
      width: 100%; height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.42s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 14px;
    }
    .card.flipped .card-inner,
    .card.matched .card-inner {
      transform: rotateY(180deg);
    }
    .card.matched .card-inner {
      animation: matchPop 0.38s 0.05s ease-out both;
    }
    @keyframes matchPop {
      0%   { transform: rotateY(180deg) scale(1); }
      50%  { transform: rotateY(180deg) scale(1.13); }
      100% { transform: rotateY(180deg) scale(1); }
    }
    .card-face {
      position: absolute; inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 14px;
      overflow: hidden;
    }

    /* card back — CSS only, no SVG IDs needed */
    .card-back {
      background:
        radial-gradient(circle, rgba(255,255,255,0.22) 1.5px, transparent 1.5px),
        linear-gradient(135deg, #6d28d9 0%, #be185d 100%);
      background-size: 18px 18px, 100% 100%;
      display: flex; align-items: center; justify-content: center;
    }
    .card-back::after {
      content: '?';
      font-size: clamp(1.6rem, 5.5vw, 2.6rem);
      font-weight: 900;
      color: rgba(255,255,255,0.4);
    }

    /* card front — contains inline SVG */
    .card-front {
      transform: rotateY(180deg);
    }
    .card-front svg { width: 100%; height: 100%; display: block; }

    /* matched glow */
    .card.matched .card-face.card-front {
      outline: 3px solid #fbbf24;
      box-shadow: 0 0 14px rgba(251,191,36,0.6);
    }
    .card:not(.flipped):not(.matched):hover .card-inner { transform: scale(1.05); }

    /* ─── RESULT ─── */
    .result-card {
      background: #fff; border-radius: 20px;
      padding: 32px 24px; width: 100%;
      text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }
    .result-card h2 { font-size: 1.8rem; color: #333; margin-bottom: 8px; }
    .result-time    { font-size: 3rem; font-weight: 700; color: #7c3aed; margin: 12px 0; }
    .result-card p  { color: #666; font-size: 0.95rem; }

    .name-row { width: 100%; display: flex; gap: 10px; }
    .name-row input {
      flex: 1; padding: 14px 18px; border-radius: 12px;
      border: none; font-size: 1rem; outline: 2px solid transparent;
      box-shadow: 0 4px 16px rgba(0,0,0,0.12); transition: outline 0.2s;
    }
    .name-row input:focus { outline: 2px solid #7c3aed; }

    /* ─── LEADERBOARD ─── */
    .leaderboard-card {
      background: #fff; border-radius: 20px;
      padding: 22px; width: 100%;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    .leaderboard-card h3 { text-align: center; color: #333; font-size: 1.1rem; margin-bottom: 14px; }
    .leaderboard-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .leaderboard-list li {
      display: grid; grid-template-columns: 28px 1fr auto;
      gap: 8px; align-items: center; font-size: 0.95rem;
      color: #444; padding: 6px 0; border-bottom: 1px solid #f0f0f0;
    }
    .leaderboard-list li:last-child { border-bottom: none; }
    .lb-rank { font-weight: 700; color: #7c3aed; text-align: center; }
    .lb-name { font-weight: 600; }
    .lb-time { font-variant-numeric: tabular-nums; color: #7c3aed; font-weight: 700; }
    .lb-date { font-size: 0.78rem; color: #aaa; grid-column: 2 / 4; margin-top: -4px; }
    .lb-empty { text-align: center; color: #aaa; font-style: italic; font-size: 0.9rem; padding: 8px 0; }

    /* ─── BUTTONS ─── */
    .btn {
      width: 100%; padding: 15px;
      font-size: 1.05rem; font-weight: 700;
      border: none; border-radius: 14px; cursor: pointer;
      transition: transform 0.1s; font-family: inherit;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary   { background: #7c3aed; color: #fff; box-shadow: 0 4px 16px rgba(124,58,237,0.35); }
    .btn-primary:hover { background: #6d28d9; }
    .btn-secondary { background: rgba(255,255,255,0.15); color: #fff; border: 2px solid rgba(255,255,255,0.35); box-shadow: none; }
    .btn-secondary:hover { background: rgba(255,255,255,0.25); }

    .btn-home-fixed {
      position: fixed; top: 12px; right: 12px; z-index: 200;
      background: rgba(0,0,0,0.25); border: none; border-radius: 10px;
      padding: 7px 14px; color: #fff; font-family: inherit;
      font-size: 0.85rem; font-weight: 700; text-decoration: none; cursor: pointer;
    }
    .btn-home-fixed:hover { background: rgba(0,0,0,0.4); }

    /* ─── RESPONSIVE ─── */

    /* Malý mobil na výšku */
    @media (max-width: 400px) {
      body { padding: 10px 10px 32px; }
      .title { font-size: 1.9rem; }
      .subtitle { font-size: 0.92rem; }
      .pexeso-grid { gap: 6px; }
      .btn { padding: 14px; font-size: 1rem; }
    }

    /* Velmi malý displej (< 360px) */
    @media (max-width: 360px) {
      .pexeso-grid { gap: 5px; }
      .hud { padding: 8px 14px; font-size: 1rem; }
    }

    /* Mobil na šířku — malá výška */
    @media (orientation: landscape) and (max-height: 520px) {
      body { padding: 6px 12px 16px; }
      .screen.active { gap: 10px; padding-top: 6px; }
      .hud { margin-top: 38px; padding: 7px 16px; font-size: 1rem; }
      .pexeso-grid { max-width: 360px; gap: 5px; }
      .card-back::after { font-size: 1.4rem; }
      .title { font-size: 1.7rem; }
      .subtitle { font-size: 0.88rem; }
    }

    /* Mobil na šířku — velmi malá výška (< 400px, např. starší telefony) */
    @media (orientation: landscape) and (max-height: 400px) {
      .screen.active { gap: 7px; }
      .hud { margin-top: 36px; padding: 5px 14px; font-size: 0.95rem; }
      .pexeso-grid { max-width: 300px; gap: 4px; }

    /* Tablet na výšku — karty mají více prostoru */
    @media (min-width: 600px) and (orientation: portrait) {
      .pexeso-grid { max-width: 440px; gap: 10px; }
    }

    /* Tablet na šířku */
    @media (orientation: landscape) and (min-height: 521px) and (min-width: 768px) {
      .pexeso-grid { max-width: 460px; gap: 10px; }
    }
  </style>
</head>

  // ─── STATE ───────────────────────────────────────────────
  let flipped = [], matchedCount = 0, locked = false;
  let timerStart, timerInterval, finalMs;
  const TOTAL_PAIRS = 8;

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function formatTime(ms) {
    const s = Math.floor(ms / 1000);
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }

  function buildGrid() {
    const pairs = shuffle([...ANIMALS, ...ANIMALS]);
    const grid = document.getElementById('pexeso-grid');
    grid.innerHTML = '';
    pairs.forEach(animal => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.animalId = animal.id;
      card.innerHTML = `
        <div class="card-inner">
          <div class="card-face card-back"></div>
          <div class="card-face card-front">${animal.svg}</div>
        </div>`;
      card.addEventListener('click', () => onCardClick(card));
      grid.appendChild(card);
    });
  }

  function onCardClick(card) {
    if (locked) return;
    if (card.classList.contains('flipped') || card.classList.contains('matched')) return;
    card.classList.add('flipped');
    flipped.push(card);
    if (flipped.length === 2) { locked = true; checkPair(); }
  }

  function checkPair() {
    const [a, b] = flipped;
    if (a.dataset.animalId === b.dataset.animalId) {
      a.classList.add('matched'); b.classList.add('matched');
      a.classList.remove('flipped'); b.classList.remove('flipped');
      matchedCount++;
      document.getElementById('hud-pairs').textContent = `Páry: ${matchedCount} / ${TOTAL_PAIRS}`;
      flipped = []; locked = false;
      if (matchedCount === TOTAL_PAIRS) setTimeout(endGame, 700);
    } else {
      setTimeout(() => {
        a.classList.remove('flipped'); b.classList.remove('flipped');
        flipped = []; locked = false;
      }, 950);
    }
  }

  function startGame() {
    const nameRow = document.querySelector('.name-row');
    if (nameRow) nameRow.style.display = '';
    matchedCount = 0; flipped = []; locked = false; finalMs = 0;
    clearInterval(timerInterval);
    document.getElementById('hud-pairs').textContent = `Páry: 0 / ${TOTAL_PAIRS}`;
    document.getElementById('hud-timer').textContent = '0:00';
    buildGrid();
    showScreen('screen-game');
    timerStart = Date.now();
    timerInterval = setInterval(() => {
      document.getElementById('hud-timer').textContent = formatTime(Date.now() - timerStart);
    }, 200);
  }

  function endGame() {
    clearInterval(timerInterval);
    finalMs = Date.now() - timerStart;
    document.getElementById('final-time').textContent = formatTime(finalMs);
    document.getElementById('player-name').value = '';
    showScreen('screen-end');
    renderLeaderboard('lb-end');
  }

  // ─── FIREBASE ─────────────────────────────────────────────
  const DB_URL = 'https://kids-games-3a167-default-rtdb.europe-west1.firebasedatabase.app';

  async function getScores() {
    try {
      const r = await fetch(DB_URL + '/scores/' + QUIZ_TYPE + '.json');
      const d = await r.json();
      const scores = Array.isArray(d) ? d : [];
      const ym = new Date().getFullYear() + '-' + String(new Date().getMonth()+1).padStart(2,'0');
      if (scores.some(s => !s.month || s.month !== ym)) return [];
      return scores;
    } catch { return []; }
  }

  async function saveScore() {
    const nameInput = document.getElementById('player-name');
    const name = nameInput.value.trim();
    if (!name) { nameInput.style.outline = '3px solid #ef4444'; nameInput.focus(); return; }
    nameInput.style.outline = '';
    const scores = await getScores();
    const ym = new Date().getFullYear() + '-' + String(new Date().getMonth()+1).padStart(2,'0');
    scores.push({ name, ms: finalMs, month: ym, date: new Date().toLocaleDateString('cs-CZ') });
    scores.sort((a, b) => a.ms - b.ms);
    const top10 = scores.slice(0, 10);
    try {
      await fetch(DB_URL + '/scores/' + QUIZ_TYPE + '.json', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(top10)
      });
    } catch {}
    renderLeaderboard('lb-end');
    document.querySelector('.name-row').style.display = 'none';
    nameInput.value = '';
  }

  async function renderLeaderboard(elId) {
    const el = document.getElementById(elId);
    el.innerHTML = '<li class="lb-empty">Načítám…</li>';
    const scores = await getScores();
    if (!scores.length) { el.innerHTML = '<li class="lb-empty">Zatím žádné výsledky.</li>'; return; }
    el.innerHTML = scores.map((s, i) => `
      <li>
        <span class="lb-rank">${i + 1}.</span>
        <span class="lb-name">${esc(s.name)}</span>
        <span class="lb-time">${formatTime(s.ms)}</span>
        <span class="lb-date">${esc(s.date || '')}</span>
      </li>`).join('');
  }

  function esc(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  renderLeaderboard('lb-start');
</script>
