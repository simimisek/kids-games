  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1b5e20 0%, #2e7d32 100%);
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: flex-start;
      padding: 16px 16px 40px;
      overflow-x: hidden;
    }

    /* ─── PLOVOUCÍ POZADÍ ─── */
    .bg-float {
      position: fixed; inset: 0;
      pointer-events: none; z-index: 0; overflow: hidden;
    }
    .bg-float span {
      position: absolute; font-size: 2.8rem;
      opacity: 0.13; animation: bgFloat 7s ease-in-out infinite; user-select: none;
    }
    .bg-float span:nth-child(1)  { top:  4%; left:  2%; animation-delay: 0s;   font-size: 3rem; }
    .bg-float span:nth-child(2)  { top:  7%; left: 73%; animation-delay: 1.2s; font-size: 2.6rem; }
    .bg-float span:nth-child(3)  { top: 20%; left: 88%; animation-delay: 0.6s; font-size: 2.2rem; }
    .bg-float span:nth-child(4)  { top: 38%; left:  1%; animation-delay: 2.0s; font-size: 3.4rem; }
    .bg-float span:nth-child(5)  { top: 58%; left: 91%; animation-delay: 0.9s; font-size: 2.5rem; }
    .bg-float span:nth-child(6)  { top: 73%; left:  7%; animation-delay: 1.7s; font-size: 3.0rem; }
    .bg-float span:nth-child(7)  { top: 84%; left: 54%; animation-delay: 3.1s; font-size: 2.8rem; }
    .bg-float span:nth-child(8)  { top: 91%; left: 19%; animation-delay: 0.4s; font-size: 3.2rem; }
    .bg-float span:nth-child(9)  { top: 49%; left: 50%; animation-delay: 2.4s; font-size: 2.0rem; opacity: 0.08; }
    .bg-float span:nth-child(10) { top: 14%; left: 40%; animation-delay: 1.1s; font-size: 2.4rem; }
    .bg-float span:nth-child(11) { top: 66%; left: 68%; animation-delay: 3.6s; font-size: 2.9rem; }
    .bg-float span:nth-child(12) { top: 33%; left: 24%; animation-delay: 1.8s; font-size: 2.6rem; }
    @keyframes bgFloat {
      0%,100% { transform: translateY(0) rotate(-5deg); }
      50%      { transform: translateY(-16px) rotate(5deg); }
    }

    /* ─── SCREENS ─── */
    .screen { position: relative; z-index: 1; display: none; width: 100%; max-width: 480px; }
    .screen.active { display: flex; flex-direction: column; align-items: center; gap: 16px; padding-top: 16px; }

    /* ─── TITULNÍ ─── */
    .title {
      font-size: 2.2rem; color: #fff;
      text-align: center; text-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .subtitle {
      color: rgba(255,255,255,0.85);
      text-align: center; font-size: 1rem; line-height: 1.65;
    }

    /* ─── HUD ─── */
    .hud {
      width: 100%; display: flex; justify-content: space-between; align-items: center;
      background: rgba(255,255,255,0.2); border-radius: 14px;
      padding: 10px 20px; margin-top: 55px;
      color: #fff; font-size: 1.1rem; font-weight: 600;
    }
    .hud-timer { font-variant-numeric: tabular-nums; }

    /* ─── PROGRESS BAR ─── */
    .progress-wrap {
      width: 100%; background: rgba(255,255,255,0.2);
      border-radius: 99px; height: 7px; overflow: hidden;
    }
    .progress-fill {
      height: 100%; background: #fff;
      border-radius: 99px; transition: width 0.5s ease;
    }

    /* ─── HERNÍ KARTA ─── */
    .word-card {
      background: #fff; border-radius: 20px;
      padding: 28px 20px 24px; width: 100%;
      text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.2);
      position: relative;
    }
    .word-emoji {
      font-size: 5.5rem; line-height: 1.1; margin-bottom: 8px;
      display: block;
      transition: transform 0.3s;
    }
    .word-emoji.bounce {
      animation: emojiBounce 0.5s ease;
    }
    @keyframes emojiBounce {
      0%   { transform: scale(1); }
      30%  { transform: scale(1.3) rotate(-8deg); }
      60%  { transform: scale(1.2) rotate(6deg); }
      100% { transform: scale(1) rotate(0); }
    }

    /* ─── KOLONKY (blanks) ─── */
    .blanks {
      display: flex; justify-content: center;
      gap: 7px; flex-wrap: wrap;
      margin: 18px 0 6px;
    }
    .blank-box {
      position: relative;
      width: 52px; height: 58px;
      border-bottom: 4px solid #2e7d32;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.7rem; font-weight: 700; color: #1b5e20;
      border-radius: 4px 4px 0 0;
      transition: background 0.2s, border-color 0.2s;
    }
    /* Nápověda diakritiky — malý symbol v rohu políčka */
    .diacritic-hint {
      position: absolute; top: 3px; right: 5px;
      font-size: 0.72rem; font-weight: 700;
      color: #81c784; line-height: 1;
      pointer-events: none; user-select: none;
    }
    .blank-box.just-filled {
      animation: popIn 0.28s ease;
    }
    @keyframes popIn {
      0%   { transform: scale(0.5); opacity: 0.5; }
      70%  { transform: scale(1.18); }
      100% { transform: scale(1); opacity: 1; }
    }
    .blank-box.complete {
      background: rgba(34,197,94,0.13);
      border-bottom-color: #22c55e;
    }

    /* ─── DLAŽDICE (tiles) ─── */
    .tiles {
      display: flex; justify-content: center;
      gap: 10px; flex-wrap: wrap;
      padding: 18px 4px 4px;
    }
    .tile {
      width: 56px; height: 56px;
      background: #f0fdf4; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.55rem; font-weight: 700; color: #1b5e20;
      box-shadow: 0 4px 10px rgba(0,0,0,0.12);
      cursor: pointer; border: 2px solid #a7f3d0;
      transition: transform 0.1s, background 0.15s, opacity 0.2s;
      user-select: none; -webkit-tap-highlight-color: transparent;
    }
    .tile:hover:not(.used):not(.wrong-flash) {
      transform: translateY(-5px); background: #dcfce7;
    }
    .tile:active:not(.used) { transform: scale(0.92); }
    .tile.used {
      visibility: hidden; pointer-events: none;
    }
    .tile.wrong-flash {
      background: #fee2e2; border-color: #ef4444; color: #ef4444;
      animation: tileShake 0.42s ease;
    }
    @keyframes tileShake {
      0%,100% { transform: translateX(0); }
      20%  { transform: translateX(-7px); }
      40%  { transform: translateX(7px); }
      60%  { transform: translateX(-4px); }
      80%  { transform: translateX(4px); }
    }

    /* ─── KONEC HRY ─── */
    .result-card {
      background: #fff; border-radius: 20px;
      padding: 32px 24px; width: 100%;
      text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }
    .result-card h2 { font-size: 1.8rem; color: #333; margin-bottom: 8px; }
    .result-time { font-size: 3rem; font-weight: 700; color: #2e7d32; margin: 12px 0; }
    .result-card p { color: #666; font-size: 0.95rem; }

    /* ─── ULOŽENÍ ─── */
    .save-row { width: 100%; display: flex; gap: 10px; }
    .save-row input {
      flex: 1; padding: 14px 18px; border-radius: 12px; border: none;
      font-size: 1rem; outline: 2px solid transparent;
      box-shadow: 0 4px 16px rgba(0,0,0,0.12); transition: outline 0.2s;
    }
    .save-row input:focus { outline: 2px solid #2e7d32; }

    /* ─── ŽEBŘÍČEK ─── */
    .leaderboard-card {
      background: #fff; border-radius: 20px; padding: 22px;
      width: 100%; box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    .leaderboard-card h3 {
      text-align: center; color: #333; font-size: 1.1rem; margin-bottom: 14px;
    }
    .leaderboard-list {
      list-style: none; display: flex; flex-direction: column; gap: 8px;
    }
    .leaderboard-list li {
      display: grid; grid-template-columns: 28px 1fr auto;
      gap: 8px; align-items: center; font-size: 0.95rem; color: #444;
      padding: 6px 0; border-bottom: 1px solid #f0f0f0;
    }
    .leaderboard-list li:last-child { border-bottom: none; }
    .lb-rank { font-weight: 700; color: #2e7d32; text-align: center; }
    .lb-name { font-weight: 600; }
    .lb-time { font-variant-numeric: tabular-nums; color: #2e7d32; font-weight: 700; }
    .lb-date { font-size: 0.78rem; color: #aaa; grid-column: 2/4; margin-top: -4px; }
    .lb-empty {
      text-align: center; color: #aaa; font-style: italic;
      font-size: 0.9rem; padding: 8px 0;
    }

    /* ─── TLAČÍTKA ─── */
    .btn {
      width: 100%; padding: 15px;
      font-size: 1.05rem; font-weight: 700;
      border: none; border-radius: 14px; cursor: pointer;
      transition: transform 0.1s; font-family: inherit;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary {
      background: #2e7d32; color: #fff;
      box-shadow: 0 4px 16px rgba(46,125,50,0.35);
    }
    .btn-primary:hover { background: #1b5e20; }
    .btn-secondary {
      background: rgba(46,125,50,0.1); color: #2e7d32;
      border: 2px solid rgba(46,125,50,0.25); box-shadow: none;
    }
    .btn-secondary:hover { background: rgba(46,125,50,0.18); }

    /* ─── DOMŮ BUTTON ─── */
    .btn-home-fixed {
      position: fixed; top: 12px; right: 12px; z-index: 200;
      background: rgba(0,0,0,0.25); border: none; border-radius: 10px;
      padding: 7px 14px; color: #fff; font-family: inherit;
      font-size: 0.85rem; font-weight: 700; text-decoration: none; cursor: pointer;
    }
    .btn-home-fixed:hover { background: rgba(0,0,0,0.4); }

    /* ─── RESPONZIVITA ─── */
    @media (max-width: 400px) {
      body { padding: 10px 10px 32px; }
      .title { font-size: 1.85rem; }
      .subtitle { font-size: 0.9rem; }
      .word-emoji { font-size: 4.2rem; }
      .blank-box { width: 44px; height: 50px; font-size: 1.45rem; }
      .tile { width: 48px; height: 48px; font-size: 1.35rem; }
      .btn { padding: 13px; font-size: 0.98rem; }
    }
  </style>
</head>

<script>
  // ─── CONFIG ───────────────────────────────────────────────────────────────
  const QUIZ_TYPE = 'czech-spell-word';
  const DB_URL    = 'https://kids-games-3a167-default-rtdb.europe-west1.firebasedatabase.app';
  let finalMs = 0;

  // ─── SLOVNÍ ZÁSOBY (12 slov každá délka) ─────────────────────────────────
  const WORD_POOLS = {
    3: [
      { word: 'oko',  emoji: '👁️' },
      { word: 'pes',  emoji: '🐶' },
      { word: 'had',  emoji: '🐍' },
      { word: 'kůň',  emoji: '🐴' },
      { word: 'les',  emoji: '🌲' },
      { word: 'nos',  emoji: '👃' },
      { word: 'rak',  emoji: '🦞' },
      { word: 'sýr',  emoji: '🧀' },
      { word: 'med',  emoji: '🍯' },
      { word: 'dům',  emoji: '🏠' },
      { word: 'lev',  emoji: '🦁' },
      { word: 'míč',  emoji: '⚽' },
    ],
    4: [
      { word: 'ryba',  emoji: '🐟' },
      { word: 'koza',  emoji: '🐐' },
      { word: 'vlak',  emoji: '🚂' },
      { word: 'žába',  emoji: '🐸' },
      { word: 'sova',  emoji: '🦉' },
      { word: 'šnek',  emoji: '🐌' },
      { word: 'krab',  emoji: '🦀' },
      { word: 'auto',  emoji: '🚗' },
      { word: 'květ',  emoji: '🌸' },
      { word: 'bota',  emoji: '👟' },
      { word: 'kolo',  emoji: '🚲' },
      { word: 'drak',  emoji: '🪁' },
    ],
    5: [
      { word: 'strom', emoji: '🌳' },
      { word: 'kytka', emoji: '🌺' },
      { word: 'hroch', emoji: '🦛' },
      { word: 'kočka', emoji: '🐱' },
      { word: 'ježek', emoji: '🦔' },
      { word: 'liška', emoji: '🦊' },
      { word: 'motýl', emoji: '🦋' },
      { word: 'zebra', emoji: '🦓' },
      { word: 'myška', emoji: '🐭' },
      { word: 'beran', emoji: '🐏' },
      { word: 'balón', emoji: '🎈' },
      { word: 'loďka', emoji: '⛵' },
    ]
  };

  // ─── STATE ────────────────────────────────────────────────────────────────
  let selectedWords  = [];
  let currentWordIdx = 0;
  let filledCount    = 0;
  let wordLocked     = false;
  let timerStart     = null;
  let timerInterval  = null;

  // ─── HELPERS ──────────────────────────────────────────────────────────────
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  // ─── TIMER ────────────────────────────────────────────────────────────────
  function startTimer() {
    timerStart = Date.now();
    timerInterval = setInterval(() => {
      document.getElementById('hud-timer').textContent = fmtTime(Date.now() - timerStart);
    }, 100);
  }

  function stopTimer() {
    clearInterval(timerInterval);
    finalMs = Date.now() - timerStart;
  }

  function fmtTime(ms) {
    const s = Math.floor(ms / 1000);
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }

  // ─── DIAKRITIC HINT ──────────────────────────────────────────────────────
  // Vrátí malý symbol nápovědy pro políčko — dítě ví, že písmeno má háček/čárku
  function getDiacriticHint(letter) {
    if ('čšžřňďťě'.includes(letter)) return 'ˇ';   // háček
    if ('áéíóúý'.includes(letter))   return '´';   // čárka
    if (letter === 'ů')               return '°';   // kroužek
    return '';
  }

  // ─── GAME FLOW ────────────────────────────────────────────────────────────
  function startGame() {
    // Vyber po jednom slově z každé skupiny
    selectedWords = [
      pick(WORD_POOLS[3]),
      pick(WORD_POOLS[4]),
      pick(WORD_POOLS[5])
    ];
    currentWordIdx = 0;
    filledCount    = 0;
    wordLocked     = false;
    finalMs        = 0;
    clearInterval(timerInterval);

    document.getElementById('save-row').style.display = '';
    document.getElementById('hud-timer').textContent = '0:00';

    showScreen('screen-game');
    renderWord();
    startTimer();
  }

  function renderWord() {
    wordLocked  = false;
    filledCount = 0;

    const { word, emoji } = selectedWords[currentWordIdx];
    const letters = word.split('');

    // HUD + progress
    document.getElementById('hud-word').textContent = `Slovo ${currentWordIdx + 1} / 3`;
    document.getElementById('progress-fill').style.width = (currentWordIdx / 3 * 100) + '%';

    // Emoji
    const emojiEl = document.getElementById('word-emoji');
    emojiEl.textContent = emoji;

    // Kolonky
    const blanksEl = document.getElementById('blanks');
    blanksEl.innerHTML = '';
    letters.forEach((letter, i) => {
      const box = document.createElement('div');
      box.className = 'blank-box';
      box.id = 'blank-' + i;
      // Nápověda diakritiky
      const hint = getDiacriticHint(letter);
      if (hint) {
        const hintEl = document.createElement('span');
        hintEl.className = 'diacritic-hint';
        hintEl.textContent = hint;
        box.appendChild(hintEl);
      }
      blanksEl.appendChild(box);
    });

    // Dlaždice (zamíchané)
    const shuffled = shuffle(letters);
    const tilesEl  = document.getElementById('tiles');
    tilesEl.innerHTML = '';
    shuffled.forEach((letter, i) => {
      const btn = document.createElement('button');
      btn.className  = 'tile';
      btn.textContent = letter.toUpperCase();
      btn.dataset.idx = i;
      btn.onclick = () => handleTile(btn, letter);
      tilesEl.appendChild(btn);
    });
  }

  function handleTile(tileEl, letter) {
    if (wordLocked) return;
    if (tileEl.classList.contains('used')) return;

    const { word } = selectedWords[currentWordIdx];
    const expected = word[filledCount];

    if (letter === expected) {
      // ✅ Správné písmeno
      tileEl.classList.add('used');

      const blankEl = document.getElementById('blank-' + filledCount);
      blankEl.innerHTML = '';                        // odstraní hint nápovědu
      blankEl.textContent = letter.toUpperCase();
      blankEl.classList.add('just-filled');
      setTimeout(() => blankEl.classList.remove('just-filled'), 300);

      filledCount++;

      if (filledCount === word.length) {
        // Slovo hotové
        wordLocked = true;
        word.split('').forEach((_, i) => {
          document.getElementById('blank-' + i).classList.add('complete');
        });
        // Emoji "bounce"
        const emojiEl = document.getElementById('word-emoji');
        emojiEl.classList.add('bounce');
        setTimeout(() => emojiEl.classList.remove('bounce'), 600);

        setTimeout(() => {
          currentWordIdx++;
          if (currentWordIdx >= 3) {
            stopTimer();
            document.getElementById('final-time').textContent = fmtTime(finalMs);
            document.getElementById('player-name').value = '';
            showScreen('screen-end');
            renderLeaderboard('lb-end');
          } else {
            renderWord();
          }
        }, 950);
      }
    } else {
      // ❌ Špatné písmeno — záblesk, nic se nezmění
      tileEl.classList.add('wrong-flash');
      setTimeout(() => tileEl.classList.remove('wrong-flash'), 500);
    }
  }

  // ─── FIREBASE ─────────────────────────────────────────────────────────────
  async function getScores() {
    try {
      const r = await fetch(DB_URL + '/scores/' + QUIZ_TYPE + '.json');
      const d = await r.json();
      const scores = Array.isArray(d) ? d : [];
      const ym = new Date().getFullYear() + '-' + String(new Date().getMonth() + 1).padStart(2, '0');
      if (scores.some(s => !s.month || s.month !== ym)) return [];
      return scores;
    } catch { return []; }
  }

  async function saveScore() {
    const nameInput = document.getElementById('player-name');
    const name = nameInput.value.trim();
    if (!name) { nameInput.style.outline = '3px solid #ef4444'; nameInput.focus(); return; }
    nameInput.style.outline = '';
    const scores = await getScores();
    const ym = new Date().getFullYear() + '-' + String(new Date().getMonth() + 1).padStart(2, '0');
    scores.push({ name, ms: finalMs, month: ym, date: new Date().toLocaleDateString('cs-CZ') });
    scores.sort((a, b) => a.ms - b.ms);
    const top10 = scores.slice(0, 10);
    try {
      await fetch(DB_URL + '/scores/' + QUIZ_TYPE + '.json', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(top10)
      });
    } catch {}
    renderLeaderboard('lb-end');
    document.getElementById('save-row').style.display = 'none';
    nameInput.value = '';
  }

  async function renderLeaderboard(elId) {
    const el = document.getElementById(elId);
    el.innerHTML = '<li class="lb-empty">Načítám…</li>';
    const scores = await getScores();
    if (!scores.length) { el.innerHTML = '<li class="lb-empty">Zatím žádné výsledky.</li>'; return; }
    el.innerHTML = scores.map((s, i) => `
      <li>
        <span class="lb-rank">${i + 1}.</span>
        <span class="lb-name">${esc(s.name)}</span>
        <span class="lb-time">${fmtTime(s.ms)}</span>
        <span class="lb-date">${esc(s.date)}</span>
      </li>`).join('');
  }

  function esc(str) {
    return String(str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ─── INIT ─────────────────────────────────────────────────────────────────
  renderLeaderboard('lb-start');
</script>
</body>
</html>
